name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Nexora-Windows
            out: build/windows/x64/runner/Release
          - os: ubuntu-latest
            artifact: Nexora-Linux
            out: build/linux/x64/release/bundle
          - os: macos-latest
            artifact: Nexora-macOS
            out: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }} --release
        shell: bash
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage
          cp -r "${{ matrix.out }}"/. stage/
          cd stage
          7z a ../${{ matrix.artifact }}.zip . -r || zip -r ../${{ matrix.artifact }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
